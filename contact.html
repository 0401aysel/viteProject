<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact page</title>
  </head>
  <body class="m-0 bg-[#F5F5F5]">
    <div class="container m-auto max-w-300 bg-(--white)">
      <div id="header" class="sticky top-0 z-2 bg-white"></div>
      <div id="contact" class="text-center">
        <div class="inner-container inner-txt p-5 lg:p-7.5 xl:p-15">
          <form
            class="contact-form m-auto w-max max-w-full rounded-2xl p-2.5 sm:border sm:border-[#282a3a45] sm:p-15 [&>div]:mb-5 [&>div>input]:rounded-sm [&>div>input]:border [&>div>input]:border-(--black) [&>div>input]:px-2.5 [&>div>input]:py-1.25 [&>div>input]:text-sm [&>div>input]:text-(--black) [&>div>input]:transition-all [&>div>input]:duration-200 [&>div>input]:ease-linear [&>div>input]:sm:px-7.5 [&>div>input]:sm:text-base [&>div>input:focus-visible]:scale-105 [&>div>input:focus-visible]:outline-none [&>div>label]:inline-block [&>div>label]:w-24 [&>div>label]:text-left [&>div>label]:text-xl [&>div>label]:text-(--black) [&>div>label]:capitalize [&>div>label]:sm:w-48"
          >
            <div>
              <label for="name">Name:</label>
              <input type="text" id="name" name="name" />
              <p class="errorName text-right text-xs text-(--brown)"></p>
            </div>
            <div>
              <label for="surname">surname:</label>
              <input type="text" id="surname" name="surname" />
              <p class="errorSurname text-right text-xs text-(--brown)"></p>
            </div>
            <div>
              <label for="email">email:</label>
              <input type="text" id="email" name="email" />
              <p class="errorMail text-right text-xs text-(--brown)"></p>
            </div>
            <button
              class="mt-5 cursor-pointer rounded-[20px] border-none bg-(--brown) px-5 py-2.5 text-(--white) transition-all duration-200 ease-linear active:scale-90"
              type="submit"
            >
              Click me
            </button>
          </form>
        </div>
      </div>
      <div id="footer"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/components/contact/index.ts"></script>
  </body>
</html>
