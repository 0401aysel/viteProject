<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact page</title>
</head>
<body>
    <div class="container">
        <div id="header" class="sticky top-0 bg-white z-2"></div>
        <div id="contact" class="text-center">
            <div class="inner-container inner-txt p-[20px] lg:p-[30px] xl:p-[60px]">
                <form class="contact-form m-auto rounded-2xl w-max max-w-[100%] p-[10px] sm:p-[60px] sm:border sm:border-[#282a3a45]">
                    <div class="mb-[20px]">
                        <label class="text-left text-xl capitalize text-(--black) sm:w-48 w-24 inline-block" for="name">Name:</label>
                        <input type="text" id="name" name="name" class="text-(--black) sm:text-base text-sm border border-(--black) rounded-sm sm:px-[30px] px-[10px] py-[5px]">
                        <p class="errorName text-right text-(--brown) text-xs"></p>
                    </div>
                    <div class="mb-[20px]">
                        <label class="text-left text-xl capitalize text-(--black) sm:w-48 w-24 inline-block" for="surname">surname:</label>
                        <input type="text" id="surname" name="surname" class="text-(--black) sm:text-base text-sm border border-(--black) rounded-sm sm:px-[30px] px-[10px] py-[5px]">
                        <p class="errorSurname text-right text-(--brown) text-xs"></p>
                    </div>
                    <div class="mb-[20px]">
                        <label class="text-left text-xl capitalize text-(--black) sm:w-48 w-24 inline-block" for="email">email:</label>
                        <input type="text" id="email" name="email" class="text-(--black) sm:text-base text-sm border border-(--black) rounded-sm sm:px-[30px] px-[10px] py-[5px]">
                        <p class="errorMail text-right text-(--brown) text-xs"></p>
                    </div>
                    <button class="mt-[20px] text-(--white) bg-(--brown) px-[20px] py-[10px] border-none rounded-[20px]" type="submit">Click me</button>
                </form>
            </div>
        </div>
        <div id="footer"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/components/contact/index.js"></script>
</body>
</html>
