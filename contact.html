<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact page</title>
</head>
<body class="m-0 bg-[#F5F5F5]">
    <div class="container m-auto bg-(--white) max-w-300">
        <div id="header" class="sticky top-0 bg-white z-2"></div>
        <div id="contact" class="text-center">
            <div class="inner-container inner-txt p-5 lg:p-7.5 xl:p-15">
                <form class="
                    contact-form m-auto rounded-2xl w-max max-w-full p-2.5 sm:p-15 sm:border sm:border-[#282a3a45] 
                    [&>div]:mb-5 
                    [&>div>input:focus-visible]:scale-105 [&>div>input:focus-visible]:outline-none [&>div>input]:transition-all [&>div>input]:duration-200 [&>div>input]:ease-linear [&>div>input]:text-(--black) [&>div>input]:sm:text-base [&>div>input]:text-sm [&>div>input]:border [&>div>input]:border-(--black) [&>div>input]:rounded-sm [&>div>input]:sm:px-7.5 [&>div>input]:px-2.5 [&>div>input]:py-1.25
                    [&>div>label]:text-left [&>div>label]:capitalize [&>div>label]:inline-block [&>div>label]:text-xl [&>div>label]:text-(--black) [&>div>label]:sm:w-48 [&>div>label]:w-24
                ">
                    <div>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name">
                        <p class="errorName text-right text-(--brown) text-xs"></p>
                    </div>
                    <div>
                        <label for="surname">surname:</label>
                        <input type="text" id="surname" name="surname">
                        <p class="errorSurname text-right text-(--brown) text-xs"></p>
                    </div>
                    <div>
                        <label for="email">email:</label>
                        <input type="text" id="email" name="email">
                        <p class="errorMail text-right text-(--brown) text-xs"></p>
                    </div>
                    <button class="active:scale-90 transition-all duration-200 ease-linear cursor-pointer mt-5 text-(--white) bg-(--brown) px-5 py-2.5 border-none rounded-[20px]" type="submit">
                        Click me
                    </button>
                </form>
            </div>
        </div>
        <div id="footer"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/components/contact/index.js"></script>
</body>
</html>
